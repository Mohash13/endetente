<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mo&Mi Asia</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#f4f6f9;
  --white:#ffffff;
  --navy:#0f172a;
  --navy2:#1e293b;
  --blue:#2563eb;
  --blue2:#3b82f6;
  --border:#dbe3ee;
  --text:#111827;
  --muted:#6b7280;
  --shadow:0 10px 35px rgba(15,23,42,.08);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Manrope',sans-serif;
  background:var(--bg);
  color:var(--text);
}

.layout{
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:280px;
  background:var(--navy);
  color:white;
  padding:28px;
  position:fixed;
  height:100vh;
  overflow:auto;
}

.logo h1{
  font-size:34px;
  font-weight:800;
}

.logo p{
  color:#94a3b8;
  margin-top:8px;
}

.budget-box{
  margin-top:30px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  padding:24px;
}

.budget-box span{
  font-size:12px;
