<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MO&MI in ASIA | Luxury Travel Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@700;800&family=Playfair+Display:italic,wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F9F8F6;
            --sidebar-bg: #FFFFFF;
            --text-main: #121212;
            --text-muted: #6B6B6B;
            --accent: #0A1128;
            --border: #EAEAEA;
            --gold: #C5A059;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); overflow: hidden; }

        .app-container { display: flex; height: 100vh; width: 100vw; }

        /* SIDEBAR */
        .sidebar {
            width: 320px; background: var(--sidebar-bg); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 50px 40px; z-index: 100;
        }
        .brand h1 { font-family: 'Syne'; font-size: 32px; line-height: 0.9; color: var(--accent); }
        .brand span { font-family: 'Playfair Display'; font-style: italic; font-size: 24px; color: var(--gold); display: block; margin-top: 5px; }
        
        .countdown-box { margin: 50px 0; }
        .countdown-label { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 10px; }
        .countdown-val { font-family: 'Syne'; font-size: 28px; font-weight: 800; }

        .nav-item { 
            padding: 15px 0; font-size: 13px; font-weight: 600; text-transform: uppercase; 
            letter-spacing: 1px; color: var(--text-muted); cursor: pointer; transition: var(--transition);
            border-bottom: 1px solid transparent; display: block;
        }
        .nav-item.active { color: var(--accent); border-bottom: 1px solid var(--accent); }

        /* MAIN CONTENT */
        .main-canvas { flex: 1; position: relative; overflow-y: auto; padding: 60px 80px; }

        .stats-bar { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); 
            gap: 20px; margin-bottom: 60px; border-top: 1px solid var(--text-main); padding-top: 30px;
        }
        .stat-item .label { font-size: 10px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 8px; }
        .stat-item .val { font-family: 'Syne'; font-size: 20px; font-weight: 800; }

        .country-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; }
        .country-card { 
            background: white; border: 1px solid var(--border); padding: 40px; 
            cursor: pointer; transition: var(--transition);
        }
        .country-card:hover { transform: translateY(-5px); border-color: var(--gold); }

        /* MODAL */
        .modal { 
            display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.98); 
            z-index: 1000; padding: 60px 100px; overflow-y: auto;
        }
        .modal.active { display: block; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-bottom: 30px; }
        label { display: block; font-size: 10px; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; color: var(--gold); }
        input, select, textarea { 
            width: 100%; padding: 15px 0; border: none; border-bottom: 1px solid var(--border);
            font-size: 16px; outline: none; background: transparent;
        }
        .btn-save { background: var(--accent); color: white; padding: 20px 40px; border: none; font-family: 'Syne'; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <div class="brand"><h1>MO&MI</h1><span>in ASIA</span></div>
            <div class="countdown-box">
                <div class="countdown-label">Départ dans</div>
                <div class="countdown-val" id="timer">-- Jours</div>
            </div>
            <nav class="nav-menu">
                <div class="nav-item active">Dashboard</div>
                <div class="nav-item">Logistique</div>
                <div class="nav-item">Dépenses</div>
            </nav>
        </aside>

        <main class="main-canvas">
            <div id="dashboard-view">
                <h2 style="font-family:'Syne'; font-size:48px; margin-bottom:40px;">The Odyssey Map.</h2>
                <div class="stats-bar" id="stats-bar">
                    </div>
                <div class="country-grid" id="country-list">
                    </div>
            </div>
        </main>
    </div>

    <div class="modal" id="country-modal">
        <div style="max-width: 900px; margin: 0 auto; position: relative;">
            <span style="position:absolute; right:0; top:0; cursor:pointer; font-size:24px;" onclick="closeCountry()">✕</span>
            <h2 id="m-title" style="font-family:'Syne'; font-size:60px; margin-bottom:40px;">Pays</h2>
            
            <div class="form-row">
                <div><label>Comment y aller (Transport)</label><input id="m-trans-type" placeholder="Ex: Vol AirAsia"></div>
                <div><label>Budget Transport (€)</label><input type="number" id="m-trans-price" placeholder="0"></div>
            </div>
            <div class="form-row">
                <div><label>Où dormir (Hébergement)</label><input id="m-hotel-name" placeholder="Nom Hostel/Airbnb"></div>
                <div><label>Budget Nuits (€)</label><input type="number" id="m-hotel-price" placeholder="0"></div>
            </div>
            <div class="form-row">
                <div><label>Budget Nourriture (€/j)</label><input type="number" id="m-food-price" placeholder="15"></div>
                <div><label>Quoi visiter</label><textarea id="m-visits" placeholder="Batu Caves, Street art..."></textarea></div>
            </div>
            <button class="btn-save" onclick="saveData()">Enregistrer & Synchroniser</button>
        </div>
    </div>

    <script>
        const BUDGET_BASE = 10000;
        let activeIdx = null;
        let data = JSON.parse(localStorage.getItem('momi_data')) || [
            { name: "Kuala Lumpur", country: "Malaisie", nights: 2, trans: "Vol", tPrice: 800, hotel: "Airbnb", hPrice: 30, food: 20, visits: "Batu Caves, Jalan Alor" },
            { name: "Penang", country: "Malaisie", nights: 2, trans: "Bus", tPrice: 5, hotel: "Hostel", hPrice: 30, food: 15, visits: "Street art" },
            { name: "Singapour", country: "Singapour", nights: 2, trans: "Bus", tPrice: 20, hotel: "Hostel", hPrice: 90, food: 40, visits: "Gardens by the Bay" },
            { name: "Bali", country: "Indonésie", nights: 7, trans: "Vol", tPrice: 75, hotel: "Airbnb", hPrice: 175, food: 25, visits: "Ubud, Surf Canggu" },
            { name: "Lombok", country: "Indonésie", nights: 7, trans: "Boat", tPrice: 30, hotel: "Bungalow", hPrice: 140, food: 20, visits: "Gili Air, Rinjani" },
            { name: "Ho Chi Minh", country: "Vietnam", nights: 2, trans: "Vol", tPrice: 70, hotel: "Hostel", hPrice: 25, food: 15, visits: "Cu Chi" },
            { name: "Bangkok", country: "Thaïlande", nights: 2, trans: "Vol", tPrice: 45, hotel: "Hostel", hPrice: 35, food: 20, visits: "Wat Pho" },
            { name: "Koh Tao", country: "Thaïlande", nights: 7, trans: "Ferry", tPrice: 25, hotel: "Bungalow", hPrice: 140, food: 20, visits: "PADI Open Water" },
            { name: "Krabi", country: "Thaïlande", nights: 7, trans: "Ferry", tPrice: 30, hotel: "Guest House", hPrice: 140, food: 20, visits: "Railay Beach" }
        ];

        function render() {
            let spent = 0, nights = 0, cities = data.length;
            const grid = document.getElementById('country-list');
            grid.innerHTML = "";
            
            data.forEach((item, i) => {
                let cost = Number(item.tPrice) + Number(item.hPrice) + (Number(item.food) * item.nights);
                spent += cost;
                nights += item.nights;
                grid.innerHTML += `
                    <div class="country-card" onclick="openModal(${i})">
                        <div style="font-size:10px; color:var(--gold); font-weight:800; margin-bottom:5px;">${item.country.toUpperCase()}</div>
                        <h3>${item.name}</h3>
                        <div style="font-size:12px; color:var(--text-muted);">${item.nights} nuits · ${item.trans}</div>
                        <div style="margin-top:20px; font-weight:800;">Budget Stop : ${cost} €</div>
                    </div>`;
            });

            document.getElementById('stats-bar').innerHTML = `
                <div class="stat-item"><div class="label">Jours</div><div class="val">${nights}</div></div>
                <div class="stat-item"><div class="label">Villes</div><div class="val">${cities}</div></div>
                <div class="stat-item"><div class="label">Budget Restant</div><div class="val" style="color:var(--gold)">${BUDGET_BASE - spent} €</div></div>
                <div class="stat-item"><div class="label">Dépensé</div><div class="val">${spent} €</div></div>
            `;
            
            const diff = new Date('2026-07-01') - new Date();
            document.getElementById('timer').innerText = Math.floor(diff / (1000*60*60*24)) + " Jours";
            localStorage.setItem('momi_data', JSON.stringify(data));
        }

        function openModal(i) {
            activeIdx = i;
            document.getElementById('m-title').innerText = data[i].name;
            document.getElementById('m-trans-type').value = data[i].trans;
            document.getElementById('m-trans-price').value = data[i].tPrice;
            document.getElementById('m-hotel-name').value = data[i].hotel;
            document.getElementById('m-hotel-price').value = data[i].hPrice;
            document.getElementById('m-food-price').value = data[i].food;
            document.getElementById('m-visits').value = data[i].visits;
            document.getElementById('country-modal').classList.add('active');
        }

        function saveData() {
            data[activeIdx].trans = document.getElementById('m-trans-type').value;
            data[activeIdx].tPrice = document.getElementById('m-trans-price').value;
            data[activeIdx].hotel = document.getElementById('m-hotel-name').value;
            data[activeIdx].hPrice = document.getElementById('m-hotel-price').value;
            data[activeIdx].food = document.getElementById('m-food-price').value;
            data[activeIdx].visits = document.getElementById('m-visits').value;
            closeCountry();
            render();
        }

        function closeCountry() { document.getElementById('country-modal').classList.remove('active'); }
        window.onload = render;
    </script>
</body>
</html>
