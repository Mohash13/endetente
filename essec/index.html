<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MO&MI ASIA | Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@700;800&family=Playfair+Display:italic,wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FDFCFB; --sidebar: #FFFFFF; --text: #121212; --muted: #757575;
            --accent: #0A1128; --gold: #C5A059; --border: #EEEEEE; --shadow: 0 15px 40px rgba(0,0,0,0.03);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

        .app { display: flex; height: 100vh; width: 100vw; }

        /* SIDEBAR EDITORIAL */
        .sidebar {
            width: 340px; background: var(--sidebar); border-right: 1px solid var(--border);
            padding: 60px 45px; display: flex; flex-direction: column; z-index: 10;
        }
        .brand h1 { font-family: 'Syne'; font-size: 38px; line-height: 0.8; color: var(--accent); }
        .brand span { font-family: 'Playfair Display'; font-style: italic; font-size: 24px; color: var(--gold); }
        
        .countdown { margin: 60px 0; }
        .cd-label { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 8px; }
        .cd-val { font-family: 'Syne'; font-size: 32px; font-weight: 800; }

        .nav-link { 
            padding: 18px 0; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--muted); cursor: pointer; transition: 0.3s; border-bottom: 1px solid transparent;
        }
        .nav-link.active { color: var(--accent); border-bottom: 1px solid var(--accent); }

        /* MAIN DASHBOARD */
        .content { flex: 1; padding: 80px; overflow-y: auto; position: relative; }
        
        .map-section {
            width: 100%; height: 350px; background: #EAE7E4; border: 1px solid var(--border);
            margin-bottom: 50px; display: flex; align-items: center; justify-content: center;
            background-image: url('https://www.transparenttextures.com/patterns/natural-paper.png');
        }

        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); margin-bottom: 60px; }
        .stat-box { background: white; padding: 35px; text-align: center; }
        .stat-label { font-size: 10px; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 12px; }
        .stat-val { font-family: 'Syne'; font-size: 24px; font-weight: 800; }

        /* CARDS & STOPS */
        .stop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; }
        .stop-card { 
            background: white; border: 1px solid var(--border); padding: 40px; 
            cursor: pointer; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .stop-card:hover { transform: translateY(-8px); border-color: var(--gold); box-shadow: var(--shadow); }
        .stop-card h3 { font-family: 'Syne'; font-size: 24px; margin-bottom: 10px; }
        .stop-card .meta { font-size: 12px; color: var(--muted); font-weight: 500; }

        /* MODAL FULLSCREEN */
        .modal { 
            display: none; position: fixed; inset: 0; background: white; 
            z-index: 1000; padding: 80px 120px; overflow-y: auto;
        }
        .modal.active { display: block; animation: slideUp 0.5s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; margin-top: 40px; }
        .field { margin-bottom: 30px; }
        .field label { display: block; font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
        .field input, .field select, .field textarea { 
            width: 100%; padding: 15px 0; border: none; border-bottom: 1px solid var(--border);
            font-size: 16px; outline: none; background: transparent; font-family: 'Inter';
        }
        .save-btn { background: var(--accent); color: white; padding: 20px 50px; border: none; font-family: 'Syne'; font-weight: 800; cursor: pointer; margin-top: 30px; }
    </style>
</head>
<body>

    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <h1>MO&MI</h1>
                <span>in ASIA</span>
            </div>

            <div class="countdown">
                <div class="cd-label">Décollage 01 Juil.</div>
                <div class="cd-val" id="days-count">-- Jours</div>
            </div>

            <nav>
                <div class="nav-link active" onclick="setView('dashboard')">Voyage & Carte</div>
                <div class="nav-link" onclick="setView('logistics')">Logements & Vols</div>
                <div class="nav-link" onclick="setView('budget')">Budget & Dépenses</div>
            </nav>
        </aside>

        <main class="content" id="main-view">
            </main>
    </div>

    <div class="modal" id="stop-modal">
        <span style="position: absolute; right: 80px; top: 60px; font-size: 30px; cursor: pointer;" onclick="closeStop()">✕</span>
        <h2 id="m-city" style="font-family: 'Syne'; font-size: 60px;">Ville</h2>
        <p id="m-country" style="font-family: 'Playfair Display'; italic; font-size: 22px; color: var(--muted); margin-bottom: 50px;">Pays</p>

        <div class="form-grid">
            <div class="left">
                <div class="field">
                    <label>Arrivée (Transport)</label>
                    <input id="in-trans-desc" placeholder="Ex: Vol AirAsia AK511">
                </div>
                <div class="field">
                    <label>Budget Transport (€)</label>
                    <input type="number" id="in-trans-price" placeholder="0">
                </div>
                <div class="field">
                    <label>Où dormir</label>
                    <input id="in-hotel-desc" placeholder="Nom de l'hôtel / Airbnb">
                </div>
                <div class="field">
                    <label>Budget Logement (€ total)</label>
                    <input type="number" id="in-hotel-price" placeholder="0">
                </div>
            </div>
            <div class="right">
                <div class="field">
                    <label>Statut de réservation</label>
                    <select id="in-status">
                        <option>En recherche</option>
                        <option>Réservé (En attente paye)</option>
                        <option>Payé & Confirmé</option>
                    </select>
                </div>
                <div class="field">
                    <label>À visiter / À faire</label>
                    <textarea id="in-notes" rows="4" placeholder="Points d'intérêt..."></textarea>
                </div>
                <div class="field">
                    <label>Budget Food/Quotidien (€/jour)</label>
                    <input type="number" id="in-food-daily" placeholder="20">
                </div>
            </div>
        </div>
        <button class="save-btn" onclick="saveStop()">Enregistrer & Synchroniser</button>
    </div>

    <script>
        const BUDGET_INIT = 10000; // 5k x 2 personnes
        let currentIdx = null;
        let itinerary = JSON.parse(localStorage.getItem('momi_master')) || [
            { city: "Kuala Lumpur", country: "Malaisie", nights: 2, tDesc: "Vol MRS-KUL", tPrice: 850, hDesc: "Airbnb Bukit Bintang", hPrice: 40, food: 20, notes: "Batu Caves, Jalan Alor", status: "En recherche" },
            { city: "Penang", country: "Malaisie", nights: 2, tDesc: "Bus", tPrice: 5, hDesc: "Hostel Georgetown", hPrice: 30, food: 15, notes: "Street art", status: "En recherche" },
            { city: "Singapour", country: "Singapour", nights: 2, tDesc: "Bus", tPrice: 20, hDesc: "Hostel Chinatown", hPrice: 100, food: 40, notes: "Gardens by the Bay", status: "En recherche" },
            { city: "Canggu", country: "Bali, ID", nights: 7, tDesc: "Vol SIN-DPS", tPrice: 80, hDesc: "Villa Boutique", hPrice: 210, food: 25, notes: "Surf & Beach Clubs", status: "En recherche" },
            { city: "Koh Tao", country: "Thaïlande", nights: 7, tDesc: "Ferry", tPrice: 30, hDesc: "Bungalow Plage", hPrice: 140, food: 20, notes: "PADI Open Water", status: "En recherche" }
        ];

        function renderDashboard() {
            const main = document.getElementById('main-view');
            let spent = 0, nights = 0;
            
            itinerary.forEach(s => {
                spent += (Number(s.tPrice) + Number(s.hPrice) + (Number(s.food) * s.nights));
                nights += s.nights;
            });

            main.innerHTML = `
                <div class="map-section"><h2 style="font-family:'Playfair Display'; font-size:40px;">Marseille → Asie du Sud-Est</h2></div>
                
                <div class="stats">
                    <div class="stat-box"><div class="stat-label">Budget Restant</div><div class="stat-val" style="color:var(--gold)">${(BUDGET_INIT - spent).toLocaleString()} €</div></div>
                    <div class="stat-box"><div class="stat-label">Total Dépensé</div><div class="stat-val">${spent.toLocaleString()} €</div></div>
                    <div class="stat-box"><div class="stat-label">Durée Estimée</div><div class="stat-val">${nights} Jours</div></div>
                    <div class="stat-box"><div class="stat-label">Étapes</div><div class="stat-val">${itinerary.length}</div></div>
                </div>

                <div class="stop-grid">${itinerary.map((s, i) => `
                    <div class="stop-card" onclick="openStop(${i})">
                        <div style="font-size:10px; color:var(--gold); font-weight:800; margin-bottom:10px;">${s.country.toUpperCase()}</div>
                        <h3>${s.city}</h3>
                        <div class="meta">${s.nights} nuits · ${s.status}</div>
                    </div>
                `).join('')}</div>
            `;
            
            updateTimer();
            localStorage.setItem('momi_master', JSON.stringify(itinerary));
        }

        function openStop(i) {
            currentIdx = i;
            const s = itinerary[i];
            document.getElementById('m-city').innerText = s.city;
            document.getElementById('m-country').innerText = s.country;
            document.getElementById('in-trans-desc').value = s.tDesc;
            document.getElementById('in-trans-price').value = s.tPrice;
            document.getElementById('in-hotel-desc').value = s.hDesc;
            document.getElementById('in-hotel-price').value = s.hPrice;
            document.getElementById('in-food-daily').value = s.food;
            document.getElementById('in-notes').value = s.notes;
            document.getElementById('in-status').value = s.status;
            document.getElementById('stop-modal').classList.add('active');
        }

        function saveStop() {
            const s = itinerary[currentIdx];
            s.tDesc = document.getElementById('in-trans-desc').value;
            s.tPrice = document.getElementById('in-trans-price').value;
            s.hDesc = document.getElementById('in-hotel-desc').value;
            s.hPrice = document.getElementById('in-hotel-price').value;
            s.food = document.getElementById('in-food-daily').value;
            s.notes = document.getElementById('in-notes').value;
            s.status = document.getElementById('in-status').value;
            
            closeStop();
            renderDashboard();
        }

        function closeStop() { document.getElementById('stop-modal').classList.remove('active'); }

        function updateTimer() {
            const diff = new Date('2026-07-01') - new Date();
            document.getElementById('days-count').innerText = Math.floor(diff / (1000*60*60*24)) + " Jours";
        }

        function setView(view) {
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            event.target.classList.add('active');
            renderDashboard(); 
        }

        window.onload = renderDashboard;
    </script>
</body>
</html>
