<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificateur de Voyage</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #666666;
      --border: #e0e0e0;
      --accent: #2c5e61;       /* Bleu-vert sobre */
      --accent-light: #f2f7f7; /* Fond bleu-vert très clair */
      --card-bg: #fafafa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      border-bottom: 2px solid var(--text);
      padding-bottom: 20px;
      margin-bottom: 30px;
    }

    .header-main {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    /* Section Configuration Initiale / Dates */
    .config-bar {
      display: flex;
      gap: 15px;
      align-items: center;
      font-size: 14px;
      color: var(--muted);
    }

    .config-bar input {
      border: 1px solid var(--border);
      padding: 4px 8px;
      font-size: 13px;
    }

    /* Zone des compteurs et budgets */
    .counters-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .counter-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 15px;
    }

    .counter-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .counter-value {
      font-size: 22px;
      font-weight: 600;
    }

    .counter-value input {
      font-size: 22px;
      font-weight: 600;
      border: none;
      background: transparent;
      width: 100%;
      color: var(--text);
    }
    .counter-value input:focus {
      outline: 1px dashed var(--accent);
    }

    /* Section Road-trip global / Calendrier */
    .section-title {
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--text);
      padding-bottom: 5px;
    }

    .roadtrip-section {
      margin-bottom: 40px;
    }

    .timeline {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      padding-bottom: 15px;
    }

    .timeline-node {
      background: var(--card-bg);
      border-left: 3px solid var(--accent);
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 12px;
      min-width: 180px;
      font-size: 13px;
    }

    .timeline-node .node-country {
      font-weight: 600;
      color: var(--accent);
    }

    .timeline-node .node-dates {
      color: var(--muted);
      font-size: 12px;
    }

    /* Système d'onglets par pays */
    .countries-management {
      margin-bottom: 40px;
    }

    .tabs-header {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      align-items: center;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
    }

    .tab-btn:hover {
      color: var(--text);
    }

    .tab-btn.active {
      border-color: var(--border) var(--border) var(--bg);
      background: var(--bg);
      color: var(--accent);
      font-weight: 600;
      margin-bottom: -1px;
      border-top: 2px solid var(--accent);
    }

    .btn-add-tab {
      background: var(--accent-light);
      border: 1px dashed var(--accent);
      color: var(--accent);
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      margin-left: 10px;
    }

    .btn-add-tab:hover {
      background: var(--accent);
      color: white;
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .panel-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .panel-dates {
      font-size: 14px;
      color: var(--muted);
    }
    .panel-dates input {
      border: 1px solid var(--border);
      padding: 3px 6px;
    }

    /* Grille de contenu à l'intérieur d'un pays */
    .country-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 30px;
    }

    .stops-area, .notes-reservations-area {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .block-title {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 12px;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Les fiches de villes / stops */
    .stop-card {
      border: 1px solid var(--border);
      padding: 15px;
      margin-bottom: 12px;
      position: relative;
    }

    .stop-card-header {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .stop-card-dates {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .stop-details {
      font-size: 13px;
      white-space: pre-wrap;
      color: #333;
    }

    /* Champs de saisie généraux */
    textarea {
      width: 100%;
      min-height: 100px;
      border: 1px solid var(--border);
      padding: 10px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
    }

    textarea:focus, input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .input-flat {
      border: 1px solid var(--border);
      padding: 6px 10px;
      font-size: 13px;
      width: 100%;
      margin-bottom: 10px;
    }

    /* Formulaire d'ajout rapide intégré */
    .inline-form {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 15px;
      margin-bottom: 15px;
    }

    /* Boutons */
    .btn {
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 6px 14px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      font-weight: 500;
    }

    .btn:hover {
      background: var(--accent);
    }

    .btn-danger {
      background: transparent;
      color: #aa2222;
      border: 1px solid #aa2222;
      padding: 2px 6px;
      font-size: 11px;
    }
    .btn-danger:hover {
      background: #aa2222;
      color: white;
    }

    .flex-row {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  
  <header>
    <div class="header-main">
      <div>
        <h1>Carnet de Route & Planification</h1>
      </div>
      <div class="config-bar">
        <label>Départ global :</label>
        <input type="date" id="global-start-date" onchange="updateGlobalDates()">
      </div>
    </div>

    <div class="counters-grid">
      <div class="counter-card">
        <div class="counter-label">Compte à rebours</div>
        <div class="counter-value" id="countdown-val">—</div>
      </div>
      <div class="counter-card">
        <div class="counter-label">Budget Total (€)</div>
        <div class="counter-value">
          <input type="number" id="budget-total" value="4000" onchange="calculateBudgets()">
        </div>
      </div>
      <div class="counter-card">
        <div class="counter-label">Dépenses engagées (€)</div>
        <div class="counter-value">
          <input type="number" id="budget-spent" value="0" onchange="calculateBudgets()">
        </div>
      </div>
      <div class="counter-card" style="background: var(--accent-light);">
        <div class="counter-label" style="color: var(--accent);">Budget Restant disponible</div>
        <div class="counter-value" id="budget-remaining" style="color: var(--accent); font-weight:700;">—</div>
      </div>
    </div>
  </header>

  <section class="roadtrip-section">
    <div class="section-title">Chronologie du Road-Trip</div>
    <div class="timeline" id="global-timeline">
      </div>
  </section>

  <section class="countries-management">
    <div class="section-title">Planification par Pays</div>
    
    <div class="tabs-header" id="tabs-container">
      <button class="btn-add-tab" onclick="promptAddCountry()">+ Ajouter un pays</button>
    </div>

    <div id="panels-container">
      </div>
  </section>

</div>

<script>
  // Structure de données principale stockée
  let travelData = {
    globalStartDate: "",
    totalBudget: 4000,
    spentBudget: 0,
    countries: [] // { id, name, startDate, endDate, stops: [], ideas: "", reservations: "" }
  };

  // Chargement des données à l'ouverture
  function init() {
    const saved = localStorage.getItem('tripPlannerData');
    if (saved) {
      travelData = JSON.parse(saved);
    } else {
      // Données de démonstration initiales épurées
      travelData.countries = [
        {
          id: "c-1",
          name: "Thaïlande",
          startDate: "",
          endDate: "",
          stops: [
            { city: "Bangkok", duration: "3 jours", details: "Arrivée aéroport, visite Wat Pho et marchés nocturnes." }
          ],
          ideas: "Idée : Prendre un train de nuit pour descendre vers les îles du sud.\nTester le street food à Chinatown.",
          reservations: "Hôtel Bangkok réservé (Booking) - Annulation gratuite."
        }
      ];
    }

    // Assigner les valeurs globales aux inputs
    document.getElementById('global-start-date').value = travelData.globalStartDate || "";
    document.getElementById('budget-total').value = travelData.totalBudget;
    document.getElementById('budget-spent').value = travelData.spentBudget;

    calculateBudgets();
    updateCountdown();
    renderTabs();
  }

  // Sauvegarde globale automatique
  function save() {
    localStorage.setItem('tripPlannerData', JSON.stringify(travelData));
    renderTimeline();
  }

  // Calculs Budgets
  function calculateBudgets() {
    travelData.totalBudget = Number(document.getElementById('budget-total').value) || 0;
    travelData.spentBudget = Number(document.getElementById('budget-spent').value) || 0;
    
    const remaining = travelData.totalBudget - travelData.spentBudget;
    document.getElementById('budget-remaining').textContent = remaining + " €";
    
    localStorage.setItem('tripPlannerData', JSON.stringify(travelData));
  }

  // Compte à rebours
  function updateCountdown() {
    travelData.globalStartDate = document.getElementById('global-start-date').value;
    const countdownEl = document.getElementById('countdown-val');
    
    if (!travelData.globalStartDate) {
      countdownEl.textContent = "—";
      return;
    }

    const today = new Date();
    today.setHours(0,0,0,0);
    const start = new Date(travelData.globalStartDate);
    start.setHours(0,0,0,0);

    const diffTime = start - today;
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

    if (diffDays > 0) {
      countdownEl.textContent = "J - " + diffDays;
    } else if (diffDays === 0) {
      countdownEl.textContent = "Jour J";
    } else {
      countdownEl.textContent = "Passé (" + Math.abs(diffDays) + " j)";
    }
  }

  function updateGlobalDates() {
    travelData.globalStartDate = document.getElementById('global-start-date').value;
    updateCountdown();
    save();
  }

  // Rendu de la frise chronologique globale
  function renderTimeline() {
    const timeline = document.getElementById('global-timeline');
    timeline.innerHTML = "";

    if (travelData.countries.length === 0) {
      timeline.innerHTML = "<p style='color: var(--muted); font-size:13px;'>Aucun pays configuré pour le moment.</p>";
      return;
    }

    // On trie ou on affiche selon l'ordre des onglets
    travelData.countries.forEach(c => {
      const node = document.createElement('div');
      node.className = 'timeline-node';
      
      const startFmt = c.startDate ? c.startDate.split('-').reverse().slice(0,2).join('/') : '??';
      const endFmt = c.endDate ? c.endDate.split('-').reverse().slice(0,2).join('/') : '??';
      
      node.innerHTML = `
        <div class="node-country">${c.name}</div>
        <div class="node-dates">${startFmt} → ${endFmt}</div>
        <div style="margin-top: 5px; color: var(--muted); font-size:11px;">
          ${c.stops.length} ville(s) prévue(s)
        </div>
      `;
      timeline.appendChild(node);
    });
  }

  // Gestion des Onglets Pays
  let activeTabId = "";

  function renderTabs() {
    const tabsContainer = document.getElementById('tabs-container');
    const addButton = tabsContainer.querySelector('.btn-add-tab');
    
    // Nettoyer les anciens onglets
    tabsContainer.querySelectorAll('.tab-btn').forEach(btn => btn.remove());

    if (travelData.countries.length > 0 && !activeTabId) {
      activeTabId = travelData.countries[0].id;
    }

    travelData.countries.forEach(c => {
      const btn = document.createElement('button');
      btn.className = `tab-btn ${c.id === activeTabId ? 'active' : ''}`;
      btn.textContent = c.name;
      btn.onclick = () => switchTab(c.id);
      tabsContainer.insertBefore(btn, addButton);
    });

    renderPanels();
    renderTimeline();
  }

  function switchTab(id) {
    activeTabId = id;
    renderTabs();
  }

  function promptAddCountry() {
    const name = prompt("Nom du nouveau pays ?");
    if (!name) return;
    
    const id = "c-" + Date.now();
    travelData.countries.push({
      id: id,
      name: name,
      startDate: "",
      endDate: "",
      stops: [],
      ideas: "",
      reservations: ""
    });
    
    activeTabId = id;
    save();
    renderTabs();
  }

  function removeCountry(id, name) {
    if (confirm(`Supprimer complètement le pays "${name}" et toutes ses données ?`)) {
      travelData.countries = travelData.countries.filter(c => c.id !== id);
      if (activeTabId === id) {
        activeTabId = travelData.countries.length > 0 ? travelData.countries[0].id : "";
      }
      save();
      renderTabs();
    }
  }

  // Rendu des panneaux de contenu pour les pays
  function renderPanels() {
    const container = document.getElementById('panels-container');
    container.innerHTML = "";

    travelData.countries.forEach(c => {
      const panel = document.createElement('div');
      panel.className = `tab-panel ${c.id === activeTabId ? 'active' : ''}`;
      
      panel.innerHTML = `
        <div class="panel-actions">
          <div class="panel-dates">
            <label>Période : du</label>
            <input type="date" value="${c.startDate || ''}" onchange="updateCountryDates('${c.id}', 'start', this.value)">
            <label>au</label>
            <input type="date" value="${c.endDate || ''}" onchange="updateCountryDates('${c.id}', 'end', this.value)">
          </div>
          <button class="btn-danger" onclick="removeCountry('${c.id}', '${c.name}')">Supprimer ce pays</button>
        </div>

        <div class="country-grid">
          
          <div class="stops-area">
            <div>
              <div class="block-title">Villes / Stops planifiés</div>
              
              <div id="stops-list-${c.id}">
                </div>

              <div class="inline-form">
                <div class="block-title" style="font-size:12px; margin-bottom:8px;">Planifier un nouveau stop</div>
                <input type="text" id="add-stop-city-${c.id}" class="input-flat" placeholder="Nom de la ville / du lieu">
                <input type="text" id="add-stop-dur-${c.id}" class="input-flat" placeholder="Durée ou dates (ex: 3 jours, du 05 au 08)">
                <textarea id="add-stop-det-${c.id}" placeholder="Détails de la ville (activités prévues, choses à faire, trajets locaux...)"></textarea>
                <button class="btn" style="margin-top:10px;" onclick="addStop('${c.id}')">Ajouter ce stop</button>
              </div>
            </div>
          </div>

          <div class="notes-reservations-area">
            <div>
              <div class="block-title">Mes idées en vrac (activités, envies)</div>
              <textarea style="min-height: 180px;" onchange="updateNotes('${c.id}', 'ideas', this.value)" placeholder="Note ici toutes tes idées de visites, restos, spots secrets...">${c.ideas || ''}</textarea>
            </div>

            <div>
              <div class="block-title">Suivi des Réservations (Hôtels, transports)</div>
              <textarea style="min-height: 180px;" onchange="updateNotes('${c.id}', 'reservations', this.value)" placeholder="Suivi de ce qui est réservé ou à réserver pour ce pays...">${c.reservations || ''}</textarea>
            </div>
          </div>

        </div>
      `;
      
      container.appendChild(panel);
      renderStops(c.id);
    });
  }

  function updateCountryDates(countryId, field, val) {
    const country = travelData.countries.find(c => c.id === countryId);
    if (country) {
      if (field === 'start') country.startDate = val;
      if (field === 'end') country.endDate = val;
      save();
    }
  }

  function updateNotes(countryId, field, val) {
    const country = travelData.countries.find(c => c.id === countryId);
    if (country) {
      country[field] = val;
      save();
    }
  }

  // Actions sur les Stops d'un pays
  function renderStops(countryId) {
    const country = travelData.countries.find(c => c.id === countryId);
    const listContainer = document.getElementById(`stops-list-${countryId}`);
    if (!listContainer) return;
    
    listContainer.innerHTML = "";

    if (country.stops.length === 0) {
      listContainer.innerHTML = "<p style='color: var(--muted); font-size:13px; margin-bottom:15px; italic'>Aucune étape ajoutée pour ce pays.</p>";
      return;
    }

    country.stops.forEach((stop, index) => {
      const card = document.createElement('div');
      card.className = 'stop-card';
      card.innerHTML = `
        <div class="stop-card-header">
          <div>${stop.city}</div>
          <button class="btn-danger" onclick="deleteStop('${countryId}', ${index})">✕</button>
        </div>
        <div class="stop-card-dates">${stop.duration}</div>
        <div class="stop-details">${stop.details || 'Pas de détails spécifiques.'}</div>
      `;
      listContainer.appendChild(card);
    });
  }

  function addStop(countryId) {
    const cityInput = document.getElementById(`add-stop-city-${countryId}`);
    const durInput = document.getElementById(`add-stop-dur-${countryId}`);
    const detInput = document.getElementById(`add-stop-det-${countryId}`);

    if (!cityInput.value.trim()) {
      alert("Veuillez saisir au moins le nom du lieu.");
      return;
    }

    const country = travelData.countries.find(c => c.id === countryId);
    if (country) {
      country.stops.push({
        city: cityInput.value.trim(),
        duration: durInput.value.trim() || "—",
        details: detInput.value.trim()
      });
      
      save();
      renderStops(countryId);

      // Reset du formulaire
      cityInput.value = "";
      durInput.value = "";
      detInput.value = "";
    }
  }

  function deleteStop(countryId, index) {
    const country = travelData.countries.find(c => c.id === countryId);
    if (country) {
      country.stops.splice(index, 1);
      save();
      renderStops(countryId);
    }
  }

  // Lancement global
  window.onload = init;
</script>

</body>
</html>
