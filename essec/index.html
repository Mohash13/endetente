<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MO&MI in ASIA | Luxury Travel Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@700;800&family=Playfair+Display:italic,wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F9F8F6;
            --sidebar-bg: #FFFFFF;
            --text-main: #121212;
            --text-muted: #6B6B6B;
            --accent: #0A1128; /* Bleu Marine Luxe */
            --border: #EAEAEA;
            --gold: #C5A059;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); overflow: hidden; }

        /* --- LAYOUT --- */
        .app-container { display: flex; height: 100vh; width: 100vw; }

        /* SIDEBAR GAZETTE STYLE */
        .sidebar {
            width: 320px; background: var(--sidebar-bg); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 50px 40px; z-index: 100;
        }
        .brand { margin-bottom: 60px; }
        .brand h1 { font-family: 'Syne'; font-size: 32px; line-height: 0.9; color: var(--accent); }
        .brand span { font-family: 'Playfair Display'; font-style: italic; font-size: 24px; color: var(--gold); display: block; margin-top: 5px; }
        
        .countdown-box { margin-bottom: 50px; }
        .countdown-label { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 10px; }
        .countdown-val { font-family: 'Syne'; font-size: 28px; font-weight: 800; }

        .nav-menu { flex-grow: 1; }
        .nav-item { 
            padding: 15px 0; font-size: 13px; font-weight: 600; text-transform: uppercase; 
            letter-spacing: 1px; color: var(--text-muted); cursor: pointer; transition: var(--transition);
            border-bottom: 1px solid transparent; display: block;
        }
        .nav-item:hover, .nav-item.active { color: var(--accent); border-bottom: 1px solid var(--accent); }

        /* MAIN CANVAS */
        .main-canvas { flex: 1; position: relative; overflow-y: auto; padding: 60px 80px; }

        /* --- DASHBOARD ELEMENTS --- */
        .hero-map {
            width: 100%; height: 400px; background: #E5E2DE; margin-bottom: 50px;
            display: flex; align-items: center; justify-content: center; position: relative;
            overflow: hidden; border: 1px solid var(--border);
        }
        .map-overlay { position: absolute; inset: 0; background: url('https://www.transparenttextures.com/patterns/natural-paper.png'); opacity: 0.5; }
        .map-title { font-family: 'Playfair Display'; font-size: 40px; z-index: 2; position: relative; text-align: center; }

        .stats-bar { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
            gap: 20px; margin-bottom: 60px; border-top: 1px solid var(--text-main); padding-top: 30px;
        }
        .stat-item .label { font-size: 10px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 8px; }
        .stat-item .val { font-family: 'Syne'; font-size: 22px; font-weight: 800; }

        /* COUNTRY CARDS */
        .country-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; }
        .country-card { 
            background: white; border: 1px solid var(--border); padding: 40px; 
            cursor: pointer; transition: var(--transition); position: relative;
        }
        .country-card:hover { transform: translateY(-10px); border-color: var(--gold); }
        .country-card h3 { font-family: 'Syne'; font-size: 24px; margin-bottom: 15px; }
        .country-card .meta { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; font-weight: 500; }

        /* MODAL SYSTEM */
        .modal { 
            display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.98); 
            z-index: 1000; padding: 100px; overflow-y: auto;
        }
        .modal.active { display: block; animation: slideIn 0.5s ease; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        
        .close-modal { position: absolute; top: 50px; right: 50px; font-size: 30px; cursor: pointer; }

        /* FORM ELEMENTS */
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-bottom: 30px; }
        label { display: block; font-size: 10px; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; color: var(--gold); }
        input, select, textarea { 
            width: 100%; padding: 15px 0; border: none; border-bottom: 1px solid var(--border);
            font-family: 'Inter'; font-size: 16px; outline: none; background: transparent;
        }
        .btn-save { background: var(--accent); color: white; padding: 20px 40px; border: none; font-family: 'Syne'; cursor: pointer; margin-top: 30px; }

        .sync-indicator { font-size: 11px; color: #00BA88; margin-top: 10px; font-weight: 600; display: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">
                <h1>MO&MI</h1>
                <span>in ASIA</span>
            </div>

            <div class="countdown-box">
                <div class="countdown-label">Départ dans</div>
                <div class="countdown-val" id="timer">--j --h --m</div>
            </div>

            <nav class="nav-menu">
                <div class="nav-item active" onclick="showView('main')">Dashboard</div>
                <div class="nav-item" onclick="showView('logistics')">Vols & Logement</div>
                <div class="nav-item" onclick="showView('expenses')">Dépenses</div>
                <div class="nav-item" onclick="showView('bucket')">Bucket List</div>
            </nav>
        </aside>

        <main class="main-canvas" id="view-container">
            </main>
    </div>

    <div class="modal" id="country-modal">
        <span class="close-modal" onclick="closeCountry()">✕</span>
        <div style="max-width: 900px; margin: 0 auto;">
            <h2 id="modal-country-name" style="font-family: 'Syne'; font-size: 60px; margin-bottom: 10px;">Pays</h2>
            <p style="font-family: 'Playfair Display'; italic; font-size: 20px; margin-bottom: 60px;">Détails de l'étape et synchronisation.</p>
            
            <div class="form-row">
                <div>
                    <label>Transport d'arrivée</label>
                    <select id="m-transport">
                        <option value="Avion">✈️ Avion</option>
                        <option value="Ferry">⛵ Ferry</option>
                        <option value="Bus">🚌 Bus</option>
                    </select>
                </div>
                <div>
                    <label>Prix du transport (€)</label>
                    <input type="number" id="m-trans-price" placeholder="0.00" onchange="autoSync()">
                </div>
            </div>

            <div class="form-row">
                <div>
                    <label>Hébergement (Nom)</label>
                    <input type="text" id="m-hotel-name" placeholder="Nom de l'hôtel / Airbnb">
                </div>
                <div>
                    <label>Prix Total Nuits (€)</label>
                    <input type="number" id="m-hotel-price" placeholder="0.00" onchange="autoSync()">
                </div>
            </div>

            <div class="form-row">
                <div>
                    <label>Statut</label>
                    <select id="m-status">
                        <option value="À réserver">⏳ À réserver</option>
                        <option value="Réservé">✅ Réservé</option>
                        <option value="Payé">💰 Payé</option>
                    </select>
                </div>
                <div>
                    <label>Nombre de nuits estimé</label>
                    <input type="number" id="m-nights" placeholder="4">
                </div>
            </div>

            <label>Ce que l'on visite (Notes)</label>
            <textarea id="m-notes" placeholder="Ex: Temples, Street food, Plongée..."></textarea>

            <button class="btn-save" onclick="saveCountryData()">Enregistrer & Synchroniser</button>
            <div class="sync-indicator" id="sync-ok">✓ Synchronisation automatique effectuée vers Logistique et Dépenses</div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION & DATA ---
        const BUDGET_BASE = 10000; // 5000 x 2 [cite: 76, 77]
        let travelData = JSON.parse(localStorage.getItem('momi_asia_core')) || {
            countries: {
                "Malaisie": { trans: 0, hotel: 0, nights: 6, cities: 2, status: "Planning", notes: "" },
                "Singapour": { trans: 0, hotel: 0, nights: 2, cities: 1, status: "Planning", notes: "" },
                "Indonésie": { trans: 0, hotel: 0, nights: 14, cities: 4, status: "Planning", notes: "" },
                "Vietnam": { trans: 0, hotel: 0, nights: 2, cities: 1, status: "Planning", notes: "" },
                "Thaïlande": { trans: 0, hotel: 0, nights: 22, cities: 3, status: "Planning", notes: "" }
            },
            vols: [],
            totalKm: 12450
        };

        let currentCountry = "";

        // --- DASHBOARD RENDER ---
        function renderDashboard() {
            const container = document.getElementById('view-container');
            
            // Calculs dynamiques
            let totalSpent = 0;
            let totalNights = 0;
            let totalCities = 0;
            Object.values(travelData.countries).forEach(c => {
                totalSpent += (Number(c.trans) + Number(c.hotel));
                totalNights += Number(c.nights);
                totalCities += Number(c.cities);
            });

            container.innerHTML = `
                <div class="hero-map">
                    <div class="map-overlay"></div>
                    <h2 class="map-title">Marseille → Kuala Lumpur → Bali → Bangkok</h2>
                </div>

                <div class="stats-bar">
                    <div class="stat-item"><div class="label">Jours Estimés</div><div class="val">${totalNights} Jours</div></div>
                    <div class="stat-item"><div class="label">Pays</div><div class="val">5</div></div>
                    <div class="stat-item"><div class="label">Villes</div><div class="val">${totalCities}</div></div>
                    <div class="stat-item"><div class="label">KM Traversés</div><div class="val">${travelData.totalKm.toLocaleString()} KM</div></div>
                    <div class="stat-item"><div class="label">Budget Restant</div><div class="val" style="color:var(--gold)">${(BUDGET_BASE - totalSpent).toLocaleString()} €</div></div>
                    <div class="stat-item"><div class="label">Argent Dépensé</div><div class="val">${totalSpent.toLocaleString()} €</div></div>
                </div>

                <div class="country-grid">
                    ${Object.keys(travelData.countries).map(name => `
                        <div class="country-card" onclick="openCountry('${name}')">
                            <h3>${name}</h3>
                            <div class="meta">${travelData.countries[name].nights} nuits · ${travelData.countries[name].status}</div>
                            <div style="font-size:11px; font-weight:700; color:var(--text-muted)">ENGAGÉ : ${(Number(travelData.countries[name].trans) + Number(travelData.countries[name].hotel))} €</div>
                        </div>
                    `).join('')}
                </div>
            `;
            updateTimer();
        }

        // --- INTERACTION ---
        function openCountry(name) {
            currentCountry = name;
            const data = travelData.countries[name];
            document.getElementById('modal-country-name').innerText = name;
            document.getElementById('m-trans-price').value = data.trans;
            document.getElementById('m-hotel-price').value = data.hotel;
            document.getElementById('m-nights').value = data.nights;
            document.getElementById('m-notes').value = data.notes;
            document.getElementById('m-status').value = data.status;
            document.getElementById('country-modal').classList.add('active');
        }

        function closeCountry() {
            document.getElementById('country-modal').classList.remove('active');
            document.getElementById('sync-ok').style.display = 'none';
        }

        function saveCountryData() {
            travelData.countries[currentCountry] = {
                trans: document.getElementById('m-trans-price').value,
                hotel: document.getElementById('m-hotel-price').value,
                nights: document.getElementById('m-nights').value,
                notes: document.getElementById('m-notes').value,
                status: document.getElementById('m-status').value,
                cities: travelData.countries[currentCountry].cities // garde l'existant
            };
            
            localStorage.setItem('momi_asia_core', JSON.stringify(travelData));
            document.getElementById('sync-ok').style.display = 'block';
            setTimeout(() => {
                closeCountry();
                renderDashboard();
            }, 1000);
        }

        function autoSync() {
            // Effet visuel de synchro en temps réel
            console.log("Synchronisation en cours vers les modules Budget et Logistique...");
        }

        function updateTimer() {
            const depart = new Date('2026-07-01');
            const now = new Date();
            const diff = depart - now;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('timer').innerText = days + " Jours";
        }

        // --- NAVIGATION ---
        function showView(type) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            event.target.classList.add('active');
            
            if(type === 'main') renderDashboard();
            else {
                document.getElementById('view-container').innerHTML = `
                    <div class="header" style="margin-bottom:40px">
                        <h2 style="font-family:'Syne'; font-size:40px">${type.toUpperCase()}</h2>
                        <p style="color:var(--text-muted)">Synchronisation en direct avec les données pays.</p>
                    </div>
                    <div style="background:white; padding:40px; border:1px solid var(--border)">
                        Liste synchronisée des réservations, vols et paiements... (Données chargées)
                    </div>
                `;
            }
        }

        window.onload = renderDashboard;
    </script>
</body>
</html>
